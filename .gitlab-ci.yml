workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && ($CI_COMMIT_REF_NAME == 'main' || $CI_COMMIT_REF_NAME == 'dev')
    - if: $CI_PIPELINE_SOURCE == 'push' && ($CI_COMMIT_REF_NAME == 'main' || $CI_COMMIT_REF_NAME == 'dev')
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - when: never

stages:
  - check
  - build

include:
  - local: '.gitlab/ci/packer-build.yml'

# Single source of truth for the vsphere/*/* build targets, referenced via
# the *build_matrix anchor below so it only appears once. check-build-matrix.sh
# fails the pipeline if this list and the vsphere/ tree drift apart.
.build_matrix: &build_matrix
  - vsphere/esx/esx8
  - vsphere/linux/centos9
  - vsphere/linux/centos10
  - vsphere/linux/rhel9
  - vsphere/linux/rhel10
  - vsphere/linux/rocky9
  - vsphere/linux/rocky10
  - vsphere/linux/ubuntu2204
  - vsphere/linux/ubuntu2404
  - vsphere/linux/ubuntu2604
  - vsphere/windows/win2019
  - vsphere/windows/win2022
  - vsphere/windows/win2025

# Keeps the build matrix above honest: fails the pipeline if a build
# directory has been added to (or removed from) vsphere/ without the
# matrix being updated to match. Split into -dev/-main/-mr so it runs with
# the environment scope (and environment-scoped CI/CD variables, if ever
# needed) matching whichever pipeline triggered it.
.check_build_matrix: &check_build_matrix
  stage: check
  image: $PACKER_CI_IMAGE
  script:
    - .gitlab/ci/check-build-matrix.sh

check_build_matrix-dev:
  <<: *check_build_matrix
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'schedule') && $CI_COMMIT_REF_NAME == 'dev'
  environment: dev

check_build_matrix-main:
  <<: *check_build_matrix
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'schedule') && $CI_COMMIT_REF_NAME == 'main'
  environment: main

check_build_matrix-mr:
  <<: *check_build_matrix
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# The list of packer builds, run in full (init, build, provision) on pushes
# to dev/main and on the scheduled rebuild. Split into -dev/-main so
# environment-scoped CI/CD variables (Settings > CI/CD > Variables >
# Environment scope: "dev" / "main") can differ per branch, same pattern as
# packer-ci's build-dev/build-main.
run_builds-dev:
  extends: .packer_build
  stage: build
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'schedule') && $CI_COMMIT_REF_NAME == 'dev'
  environment: dev
  parallel:
    matrix:
      - BUILD: *build_matrix
  before_script:
    - .gitlab/ci/changed.sh "$BUILD" || exit 0
    - !reference [.packer_build, before_script]

run_builds-main:
  extends: .packer_build
  stage: build
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'schedule') && $CI_COMMIT_REF_NAME == 'main'
  environment: main
  parallel:
    matrix:
      - BUILD: *build_matrix
  before_script:
    - .gitlab/ci/changed.sh "$BUILD" || exit 0
    - !reference [.packer_build, before_script]

# Merge request pipelines only validate that each build initializes cleanly
# (plugin resolution, template syntax) - the actual multi-hour vSphere build
# runs on push to dev/main instead, not on every MR update.
run_builds-mr:
  stage: build
  image: $PACKER_CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  parallel:
    matrix:
      - BUILD: *build_matrix
  before_script:
    - .gitlab/ci/changed.sh "$BUILD" || exit 0
    - .gitlab/ci/report-image-info.sh "$PACKER_CI_IMAGE"
  script:
    - packer init -no-upgrade "$BUILD"